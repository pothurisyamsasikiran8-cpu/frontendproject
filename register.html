<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - GameZone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">🎮 GameZone</div>

        <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#tournaments">Tournaments</a></li>
    <li><a href="index.html#matches">Matches</a></li>
    <li><a href="teams.html">My Team</a></li>
    <li><a href="index.html#leaderboard">Leaderboard</a></li>
</ul>

        <button onclick="window.location.href='index.html'">
            Back
        </button>

    </nav>
</header>


<section class="registration-page">

    <div class="registration-box">

        <div class="registration-title">

            <p>JOIN THE COMMUNITY</p>

            <h1>Player Registration</h1>

            <span>
                Create your GameZone account and start competing.
            </span>

        </div>


        <form id="registrationForm">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a gaming username"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="regEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>Select Game</label>

                <select id="game" required>

                    <option value="">
                        Select your game
                    </option>

                    <option value="BGMI">
                        BGMI
                    </option>

                    <option value="Valorant">
                        Valorant
                    </option>

                    <option value="Free Fire">
                        Free Fire
                    </option>

                    <option value="CS2">
                        Counter Strike 2
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="regPassword"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <label class="terms">

                <input type="checkbox" id="terms" required>

                I agree to the tournament rules and terms.

            </label>


            <button
                type="submit"
                class="register-submit"
            >
                Create Account 🎮
            </button>


            <p class="login-text">

                Already have an account?

                <a href="index.html" onclick="openLoginFromPage(event)">
                    Login
                </a>

            </p>

        </form>

    </div>

</section>


<footer>

    <div class="copyright">

        © 2026 GameZone. All Rights Reserved.

    </div>

</footer>


<script>

document
.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    const username =
        document.getElementById("username").value;

    const email =
        document.getElementById("regEmail").value;

    const phone =
        document.getElementById("phone").value;

    const game =
        document.getElementById("game").value;

    const password =
        document.getElementById("regPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        alert("❌ Passwords do not match!");

        return;

    }


    const player = {

        name: name,
        username: username,
        email: email,
        phone: phone,
        game: game

    };


    localStorage.setItem(
        "gameZonePlayer",
        JSON.stringify(player)
    );


    alert(
        "🎉 Registration Successful!\n\n" +
        "Welcome " + username + "!"
    );


    window.location.href = "index.html";

});

</script>

</body>
</html>
